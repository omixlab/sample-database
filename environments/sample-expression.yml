# Expression Wizard mRNA folding (sample/expression.py's 5' structure check).
#
# Separate from sample-web, which serves the wizard, because the only heavy dependency the wizard
# has is ViennaRNA -- everything else it does (codon optimization, CAI, tag/carrier assembly) is
# pure-Python stdlib and runs in-process. ViennaRNA ships a compiled RNA C library and its own
# `RNAfold` binary; keeping it here rather than adding it to every environment that imports the
# `sample` package follows the same isolation the sample-fold and sample-predictors tool
# environments use.
#
# This is a TOOL environment: it holds ViennaRNA and nothing of this project. sample/expression.py
# runs from the web/CLI environment and shells out to this one's `RNAfold` binary for the minimum
# free energy of the 5' window; when this environment is absent, the wizard falls back to a
# transparent GC/self-complementarity heuristic and says so in its report, so it never silently
# passes a guessed number off as a folded one.
name: sample-expression
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - viennarna
