name: sample-chem
channels:
  - conda-forge
  - defaults

# Steps 15-17 and 20: serialization, descriptor and embedding enrichment, decoy generation, and
# the SQLite load.
#
# No spacy, nltk, ollama or scikit-learn here -- these steps do chemistry and representation, not
# text mining or model fitting.
#
# Step 16 also invokes the third-party activity predictors, which do NOT run in this environment:
# sample/peptide_predictors.py shells out to `sample-predictors` with `conda run`, because those
# tools pin scikit-learn 1.3.1 and would corrupt any environment they were installed into. See
# environments/sample-predictors.yml.
dependencies:
  - python=3.11
  - pip
  - pip:
      # Core data handling
      - pandas
      # Reads the .xlsx source files: dbAMP's dbAMP3_pepinfo and the curated Clostridium /
      # Leishmania sheets. pandas needs it explicitly -- without it read_excel raises and the
      # caller degrades to zero rows, which is how dbAMP silently contributed no names at all.
      - openpyxl
      # Pinned <2 to match sample-extraction, which cannot go higher: its spacy 3.7.5 /
      # thinc / blis stack requires numpy 1.x. The pin has to be shared because pickles cross
      # that boundary -- step 8 writes rf_filter_model.pkl here and step 7 loads it in
      # sample-extraction -- and NumPy 2 changed the array pickle format. `make check-envs`
      # asserts the installed versions actually agree.
      - numpy<2
      - pyarrow              # pandas .to_parquet in sample/serialize.py
      - biopython
      # Imported at module level by sample/cli.py and sample/config.py, so it is required in
      # EVERY environment that runs `sample-cli`, not only the ones that read a .env file.
      - python-dotenv
      # sample/nlp.py imports this at module level, and step 32 (`sample-cli load-sql`) runs HERE
      # while reaching into nlp for `infer_activity_group` to derive each DBAASP measurement's
      # activity group from its target organism. Without it that import raised
      # ModuleNotFoundError inside a per-file `except: pass`, so the DBAASP layer contributed
      # nothing and the database shipped with 152,308 activities missing -- 60 % of the table --
      # with no error in the log. Declared in sample.yml and sample-extraction.yml already; this
      # environment was the gap.
      - pyahocorasick

      # Cheminformatics
      - rdkit
      # Sequence-defined peptide descriptors: charge, pI, Boman index, aliphatic index,
      # hydrophobic moment. Used by sample/enrichment.py for step 16's descriptor stage and by
      # sample/peptide_predictors.py for its 111-descriptor block.
      - peptides

      # Protein language model embeddings (ESM-2) computed in step 16
      # --- PyTorch, pinned to a CUDA 12.1 build ---
      # The default PyPI wheel is built for CUDA 13. This machine's driver (535.x) tops out at
      # CUDA 12.2, so that wheel installs ~5 GB of CUDA libraries and then reports
      # torch.cuda.is_available() == False -- every embedding pass silently falls back to CPU.
      # cu121 wheels work with driver >= 525 and light up the GPU for the ESM-2 pass.
      # Verified on an RTX 3060: torch.cuda.is_available() True, ESM-2 runs on `cuda`.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - transformers
      # Computes ESM-2 embeddings and persists them into a queryable vector index
      # (sample/embeddings.py, step 30) -- this is where the index is built, over
      # final_dataset.csv (the only lineage carrying is_decoy); sample-web is where a search
      # query reads the same index back, see the note there.
      - chromadb

      # UniProt fragment decoys in step 17
      - requests
      - urllib3

      - tqdm
