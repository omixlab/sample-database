# ToxinPred 3.0 for the annotator (a dedicated environment for the toxicity predictor).
#
# WHY ITS OWN ENVIRONMENT. ToxinPred 3.0 pins scikit-learn==1.3.1 to match the version its models
# were pickled with. In the shared sample-predictors env it can be *installed* but not *run*: its
# model pickle raises "node array from the pickle has an incompatible dtype" because that env's
# scikit-learn is shared with hemopi2 and cannot also be 1.3.1 without a pin fight. A dedicated
# environment is the only place its pin can be exactly right. See KNOWN_ISSUES.md.
#
# STATUS (2026-08-14): built and genuinely blocked, not merely unattempted. This exact pin --
# scikit-learn==1.3.1, the version ToxinPred 3.0's own models were trained with -- was tried first
# and still fails: "node array from the pickle has an incompatible dtype". Six scikit-learn
# versions were tried in this same environment (1.1.3, 1.2.2, 1.3.1, 1.4.2, 1.5.2, 1.6.1), each
# verified installed via this env's own pip directly; all incompatible. ToxinPred 3.0's own PyPI
# metadata does not declare scikit-learn as a dependency at all -- an upstream packaging defect,
# not something fixable by picking a different version from this side. No ToxinPredPredictor
# adapter exists in sample/peptide_predictors.py because there is nothing for it to call
# successfully yet. See DECISIONS.md's 2026-08-14 entry and KNOWN_ISSUES.md.
#
#   make env-toxinpred3     # or: conda env create -f environments/sample-toxinpred3.yml
name: sample-toxinpred3
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pip
  # The exact pin the ToxinPred 3.0 models were trained with; the whole reason for a separate env.
  - scikit-learn=1.3.1
  - numpy
  - pandas
  - pip:
      - toxinpred3
